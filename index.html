<title>A2 (2024–2027)</title>
<style>
:root{--bg:#05030f;--ink:#fff;--accent:#ffb3d9;--accent2:#9fd3ff;--panel:rgba(20,12,40,.75);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#05030f}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Quicksand","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
.frame{position:relative;height:100%;border-radius:18px;border:2px solid var(--accent);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent2),0 0 24px rgba(255,179,217,.45);overflow:hidden;
background:radial-gradient(ellipse at 20% 20%,#2a1650 0,transparent 55%),radial-gradient(ellipse at 80% 80%,#0f2a55 0,transparent 55%),#070412}
.stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.2}}
.mem{position:absolute;left:0;top:0;object-fit:cover;border-radius:0;border:3px solid rgba(255,255,255,.94);box-shadow:0 0 12px rgba(255,255,255,.4),0 4px 14px rgba(0,0,0,.4);will-change:transform;backface-visibility:hidden;pointer-events:none;transition:opacity .9s ease}
.mem.hot{box-shadow:0 0 22px rgba(255,179,217,.9)}
.frame{touch-action:none;-webkit-user-select:none;user-select:none}
.nm{position:absolute;left:0;top:0;white-space:nowrap;font-family:"Playball","Lobster",cursive;font-size:clamp(30px,7.4vw,46px);letter-spacing:.5px;color:#fff;pointer-events:none;will-change:transform;text-shadow:0 0 6px #fff,0 0 18px #ff9ad5}
.nm::after{content:attr(data-t);position:absolute;left:0;top:0;color:#fff;text-shadow:0 0 14px #ff6fc0,0 0 32px #ff6fc0,0 0 58px #a06cff;z-index:-1;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:1}}
.cw{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;perspective:1500px;pointer-events:none}
.cw .x{position:absolute;top:12px;right:12px;width:38px;height:38px;padding:0;pointer-events:auto;z-index:3}
.card{position:relative;width:min(86vw,330px);height:min(76vh,560px);opacity:0;transform:scale(.7);transition:opacity .6s,transform .8s cubic-bezier(.2,.9,.3,1.1);pointer-events:none;display:flex;align-items:center;justify-content:center}
.card.show{opacity:1;transform:scale(1)}
.ph{position:relative;z-index:1;border-radius:10px;overflow:hidden;border:3px solid #f2c777;box-shadow:0 0 0 3px rgba(255,255,255,.6),0 0 34px rgba(255,122,184,.75);opacity:0;transform:scale(.6)}
.pop .ph{animation:phs .9s .1s cubic-bezier(.2,.9,.3,1.1) forwards}
@keyframes phs{to{opacity:1;transform:scale(1)}}
.ph img{display:block;width:100%;height:100%;object-fit:cover;clip-path:circle(0% at 50% 50%)}
.pop .ph img{animation:phc 1.1s .1s ease-out forwards}
@keyframes phc{to{clip-path:circle(100% at 50% 50%)}}
.seed{position:absolute;left:50%;top:50%;width:90px;height:84px;margin:-42px 0 0 -45px;background:linear-gradient(#ff6aa8,#ff2f86);clip-path:url(#hc);transform:scale(0)}
.card.seeding .seed{animation:seedin .5s cubic-bezier(.3,1.6,.5,1) forwards,seedbeat .5s .5s ease-in-out infinite}
.card.pop .seed{animation:seedout .35s ease-in forwards}
@keyframes seedin{to{transform:scale(1)}}
@keyframes seedbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes seedout{from{transform:scale(1.15);opacity:1}to{transform:scale(2.4);opacity:0}}
.ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid #ff7ab8;opacity:0}
.pop .ring{animation:rg .9s ease-out forwards}
@keyframes rg{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(9)}}
.bp{position:absolute;left:50%;top:50%;width:0;height:0}
.bp b{position:absolute;left:0;top:0;font-weight:400;line-height:1;opacity:0;transform:translate(-50%,-50%) scale(0)}
.pop .bp b{animation:bst 1s var(--dl) cubic-bezier(.1,.7,.3,1) forwards}
@keyframes bst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}65%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1)}}
.vine{position:absolute;inset:0;z-index:6;pointer-events:none}
.vine svg.v{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.st{fill:none;stroke:#3e9a52;stroke-width:4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:gr 3s linear forwards;filter:drop-shadow(0 0 3px rgba(80,200,120,.6))}
@keyframes gr{to{stroke-dashoffset:0}}
.lf,.fw{position:absolute;width:0;height:0}
.lf i{position:absolute;left:0;top:-5px;height:10px;background:linear-gradient(90deg,#2e8b4a,#8be59d);border-radius:0 100% 0 100%;transform-origin:left center;transform:rotate(var(--a)) scale(0);animation:lp .5s var(--dl) cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes lp{to{transform:rotate(var(--a)) scale(1)}}
.fw svg{position:absolute;transform:scale(0) rotate(-90deg);animation:fp .7s var(--dl) cubic-bezier(.3,1.6,.5,1) forwards;filter:drop-shadow(0 0 4px rgba(255,255,255,.5))}
@keyframes fp{to{transform:scale(1) rotate(0)}}
@keyframes hb{0%{transform:scale(0) rotate(-12deg)}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.06)}}
.veil{position:absolute;inset:0;background:rgba(3,1,12,.9);opacity:0;transition:opacity .5s ease;z-index:9;display:none}
.veil.on{opacity:1}
.zoom{position:absolute;z-index:10;object-fit:contain;border-radius:14px;border:2px solid var(--accent);box-shadow:0 0 40px rgba(255,179,217,.6);transition:transform .6s cubic-bezier(.2,.85,.2,1);transform-origin:center center;pointer-events:none}
h1{position:absolute;top:8px;left:0;right:0;text-align:center;font-family:"Playball","Lobster",cursive;font-weight:400;font-size:clamp(26px,6.4vw,40px);letter-spacing:2px;z-index:5;pointer-events:none;background:linear-gradient(90deg,#ffd1ea,#fff,#bfe3ff,#fff,#ffd1ea);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,140,210,.7))}
.bar{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;z-index:5;padding:0 58px}
button,.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1.5px solid var(--accent);border-radius:999px;padding:9px 18px;cursor:pointer}
button:disabled{opacity:.5}
#msg{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);max-width:88%;text-align:center;font-size:13px;background:var(--panel);border:1px solid rgba(255,179,217,.5);padding:7px 14px;border-radius:999px;display:none;z-index:17}

button{font-family:"Quicksand","Segoe UI",system-ui,sans-serif;font-weight:600;transition:transform .15s,box-shadow .2s}
button:active{transform:scale(.95)}
#up{background:linear-gradient(135deg,rgba(255,122,184,.35),rgba(120,160,255,.3));box-shadow:0 0 14px rgba(255,140,210,.4)}
.gl{background:linear-gradient(160deg,rgba(40,20,78,.95),rgba(18,12,46,.95));border:1.5px solid rgba(255,179,217,.7);border-radius:18px;box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 22px rgba(255,140,210,.28)}
.ib{width:40px;height:40px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 12px rgba(255,140,210,.4)}
.ib svg{width:20px;height:20px;fill:none;stroke:#ffd1ea;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sm{font-size:12px;padding:5px 12px}
.hd{font-family:"Playball","Lobster",cursive;font-size:24px;color:#ffe3f1;text-shadow:0 0 12px #ff7ab8;line-height:1.2}
input:not([type]),input[type=text],input[type=password]{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,179,217,.5);border-radius:12px;padding:9px 12px;width:100%;outline:none}
input:focus{border-color:#ffd1ea;box-shadow:0 0 10px rgba(255,140,210,.5)}
.shk{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.dvb{position:absolute;top:calc(8px + clamp(30px,7vw,46px));left:50%;transform:translateX(-50%);width:130px;height:26px;opacity:0;background:none;border:0;padding:0;z-index:6;border-radius:0}
.nm.un{font-family:"Dancing Script","Playball",cursive;font-weight:700;font-size:clamp(17px,4.2vw,23px);color:#ffeaf5;text-shadow:0 0 5px #fff,0 0 12px #ffb3d9}
.nm.un::after{text-shadow:0 0 10px #ff9ad5,0 0 22px #9fd3ff}
#md,#gate,#ld{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,1,12,.72)}
#md{z-index:30;opacity:0;transition:opacity .25s}#md.on{opacity:1}
#gate{z-index:40;background:radial-gradient(ellipse at 50% 30%,#2a1650,#05030f)}
#ld{z-index:35;flex-direction:column;gap:14px;text-align:center;padding:20px}
#mb,.gb{width:min(88vw,340px);padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gb p{font-size:13px;opacity:.8}.gq{font-size:16px;color:#ffe3f1}
.r2{display:flex;gap:8px}.r2 button{flex:1}
.pv{max-width:100%;max-height:40vh;object-fit:contain;border:2px solid #f2c777;align-self:center}
.spin{width:64px;height:64px;animation:spin 2.6s linear infinite;color:#ff9ad5;filter:drop-shadow(0 0 10px #ff7ab8)}
@keyframes spin{to{transform:rotate(360deg)}}
#ld p{font-family:"Playball","Lobster",cursive;font-size:clamp(20px,5vw,26px);color:#ffe3f1;text-shadow:0 0 14px #ff7ab8}
.dts i{display:inline-block;width:6px;height:6px;margin:0 3px;border-radius:50%;background:#ffb3d9;animation:dot 1.2s infinite}
.dts i:nth-child(2){animation-delay:.2s}.dts i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1.2)}}
#chatb{position:absolute;right:12px;bottom:12px;z-index:16}
#devb{position:absolute;left:12px;bottom:12px;z-index:16;display:none}
.bdg{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:#ff5f8f;display:none}
#chat{position:absolute;right:10px;bottom:62px;width:min(88vw,320px);height:min(58vh,420px);z-index:15;display:none;flex-direction:column;padding:12px;gap:8px}
#chat.on{display:flex;animation:pop2 .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop2{from{opacity:0;transform:translateY(12px) scale(.94)}}
#cl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.m{font-size:13px;line-height:1.4;background:rgba(255,255,255,.07);border-radius:12px 12px 12px 3px;padding:6px 10px;word-break:break-word}
.m b{font-family:"Dancing Script",cursive;font-size:16px;margin-right:6px}
.x2{float:right;font-size:11px;padding:1px 7px}
.rw{display:flex;gap:6px}.rw button{padding:8px 14px}
#dev{position:absolute;left:10px;bottom:62px;width:min(92vw,340px);max-height:68%;overflow:auto;z-index:15;display:none;padding:14px;font-size:13px}
#dev>*+*{margin-top:8px}
.dh{display:flex;justify-content:space-between;align-items:center}
.sec{font-family:"Dancing Script",cursive;font-size:19px;color:#ffd1ea;margin-top:14px!important}
.tg{display:flex;gap:8px;align-items:center}.tg input{width:auto}
.row{display:flex;gap:6px;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border-radius:10px;padding:6px 8px}
.qg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.qi img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.qi div{display:flex;gap:4px;margin-top:4px}.qi button{flex:1;padding:4px}
</style>
<style>

background:radial-gradient(120% 80% at 12% 0,#3b1c70 0,transparent 55%),radial-gradient(100% 70% at 92% 100%,#123a72 0,transparent 55%),radial-gradient(60% 50% at 50% 50%,#26103f 0,transparent 70%),#06030f}

input:not([type]),input[type=text],input[type=password]{border-radius:14px;background:rgba(255,255,255,.07)}
.fade{position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;background:linear-gradient(180deg,rgba(6,3,15,.92) 0,rgba(6,3,15,0) 120px,rgba(6,3,15,0) calc(100% - 130px),rgba(6,3,15,.92) 100%)}

<script>
(function(){
var frame=document.getElementById('frame'),stars=document.getElementById('stars'),msg=document.getElementById('msg');
var photos=[],items=[];

// stars
for(var i=0;i<60;i++){var s=document.createElement('div');s.className='star';var z=Math.random()*2+1;
s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;opacity:'+(Math.random()*.8+.2)+';animation-delay:'+Math.random()*3+'s';stars.appendChild(s);}

function say(t,ms){msg.textContent=t;msg.style.display='block';clearTimeout(say.t);if(ms)say.t=setTimeout(function(){msg.style.display='none'},ms)}

// floating items — trôi tự do, xáo trộn; mỗi ảnh chỉ hiện 1 lần; cả "tấm" trôi cùng tốc độ nên không đè nhau

var COLS=['#ff7ab8','#ffd45a','#ffffff','#ff9a6b','#c58bff','#ff5f8f'];
function vpath(left,SW,SH,m){
  var h=m*.5,x0=h,y0=h,y1=SH-h,r=26,cx=SW/2;
  function X(x){return left?x:SW-x}
  function seg(ax,ay,bx,by){
    var len=Math.hypot(bx-ax,by-ay),k=Math.max(2,Math.round(len/55)),nx=-(by-ay)/len,ny=(bx-ax)/len,o='';
    for(var i=0;i<k;i++){
      var t0=i/k,t1=(i+1)/k,ex=ax+(bx-ax)*t1,ey=ay+(by-ay)*t1,mx=ax+(bx-ax)*(t0+t1)/2+nx*7*(i%2?1:-1),my=ay+(by-ay)*(t0+t1)/2+ny*7*(i%2?1:-1);
      o+=' Q'+X(mx).toFixed(1)+','+my.toFixed(1)+' '+X(ex).toFixed(1)+','+ey.toFixed(1);
    }
    return o;
  }
  return 'M'+X(cx)+','+y1+seg(cx,y1,x0+r,y1)+' Q'+X(x0)+','+y1+' '+X(x0)+','+(y1-r)+seg(x0,y1-r,x0,y0+r)+' Q'+X(x0)+','+y0+' '+X(x0+r)+','+y0+seg(x0+r,y0,cx,y0);
}
function buildVine(SW,SH,m){
  var v=document.getElementById('vine'),G=3,N=40,out='';
  v.innerHTML='<svg class="v" viewBox="0 0 '+SW+' '+SH+'" preserveAspectRatio="none"><path class="st" pathLength="100" d="'+vpath(true,SW,SH,m)+'"/><path class="st" pathLength="100" d="'+vpath(false,SW,SH,m)+'"/></svg>';
  var ps=v.querySelectorAll('path');
  for(var pi=0;pi<2;pi++){
    var p=ps[pi],L=p.getTotalLength();
    for(var j=0;j<=N;j++){
      var t=j/N,pt=p.getPointAtLength(L*t),x=(pt.x/SW*100).toFixed(2),y=(pt.y/SH*100).toFixed(2),dl=(t*G).toFixed(2)+'s';
      if(j%4===0||j===N){
        if(pi&&(j===0||j===N))continue;
        var big=(j===0||j===N),S=big?52:26+Math.random()*12,c=big?'#ff7ab8':COLS[Math.floor(Math.random()*COLS.length)];
        out+='<span class="fw" style="left:'+x+'%;top:'+y+'%"><svg viewBox="-12 -12 24 24" style="width:'+S+'px;height:'+S+'px;left:'+(-S/2)+'px;top:'+(-S/2)+'px;color:'+c+';--dl:'+dl+'"><use href="#fw"/></svg></span>';
      }else{
        var a=((j%2?-1:1)*(40+Math.random()*35)).toFixed(0),w=16+Math.random()*10;
        out+='<span class="lf" style="left:'+x+'%;top:'+y+'%"><i style="width:'+w.toFixed(0)+'px;--a:'+a+'deg;--dl:'+dl+'"></i></span>';
      }
    }
  }
  v.insertAdjacentHTML('beforeend',out);
}

var AC=null,master=null;
function note(f,t,d,v,type){
  var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  var o2=AC.createOscillator(),g2=AC.createGain();o2.frequency.value=f*2.01;
  g2.gain.setValueAtTime(0.0001,t);g2.gain.exponentialRampToValueAtTime(v*.3,t+.01);g2.gain.exponentialRampToValueAtTime(.0001,t+d*.5);
  o2.connect(g2);g2.connect(master);o2.start(t);o2.stop(t+d*.5+.05);
}
function sfx(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
    var t0=AC.currentTime+.05,sc=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5],i;
    for(i=0;i<14;i++)note(i<8?sc[i]:sc[i-8]*2,t0+i*.2,.9,.09);
    var len=AC.sampleRate*3.6,buf=AC.createBuffer(1,len,AC.sampleRate),dd=buf.getChannelData(0);
    for(i=0;i<len;i++)dd[i]=Math.random()*2-1;
    var ns=AC.createBufferSource();ns.buffer=buf;
    var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3000;bp.Q.value=.7;
    var ng=AC.createGain();ng.gain.setValueAtTime(0,t0);ng.gain.linearRampToValueAtTime(.05,t0+1.6);ng.gain.linearRampToValueAtTime(0,t0+3.3);
    ns.connect(bp);bp.connect(ng);ng.connect(master);ns.start(t0);
    [523.25,659.25,783.99,1046.5].forEach(function(f,k){note(f,t0+3.45+k*.07,2.4,.11)});
    [1318.5,1567.98,2093].forEach(function(f,k){note(f,t0+3.55+k*.09,1.4,.09)});[2.85,3.1,3.35].forEach(function(x){note(110,t0+x,.25,.3)});
    for(i=0;i<7;i++)note(1800+Math.random()*1600,t0+3.7+i*.1,.5,.035);
  }catch(e){}
}
function buildBurst(R){
  var h='',c=['#ff4f93','#ff7ab8','#ffd45a','#ffffff','#ff9ad5','#ff5f6f'],n=26;
  for(var i=0;i<n;i++){
    var an=i/n*Math.PI*2+Math.random()*.3,d=R*(.55+Math.random()*.5),sz=14+Math.random()*18;
    h+='<b style="font-size:'+sz.toFixed(0)+'px;color:'+c[i%6]+';--tx:'+(Math.cos(an)*d).toFixed(0)+'px;--ty:'+(Math.sin(an)*d).toFixed(0)+'px;--dl:'+(Math.random()*.1).toFixed(2)+'s">♥</b>';
  }
  document.getElementById('bp').innerHTML=h;
}

function ask(t,fn){modal('<div class="hd">'+esc(t)+'</div><div class="r2"><button id="no">Hủy</button><button id="yes">Đồng ý</button></div>');$('no').onclick=unmodal;$('yes').onclick=function(){unmodal();fn()}}

// ----- cấu hình + cổng câu hỏi -----
function qhash(){return JSON.stringify(CFG.qs||[])}
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim()}
function applyCfg(){
  $('addn').style.display=CFG.addName?'':'none';
  var qs=CFG.qs||[],can=safe(function(){return user&&user.canEdit()}),ok=safe(function(){return localStorage.getItem('a2ok')===qhash()});
  var need=CFG.gate&&qs.length&&!DEV&&!can&&!ok;
  if(need){if($('gate').style.display!=='flex')showGate()}else $('gate').style.display='none';
  renderDev();
}
function showGate(){
  var qs=CFG.qs,q=qs[Math.floor(Math.random()*qs.length)],g=$('gate');
  g.innerHTML='<div class="gl gb"><div class="hd">Cổng ký ức</div><p>Trả lời đúng để bước vào vũ trụ A2 ✦</p><b class="gq">'+esc(q.q)+'</b><input id="ga" placeholder="Câu trả lời của bạn" autocomplete="off"><button id="gg">Vào</button></div>';
  g.style.display='flex';
  var go=function(){
    var v=norm($('ga').value);
    if(v&&q.a.some(function(a){return norm(a)===v})){safe(function(){localStorage.setItem('a2ok',qhash())});g.style.display='none'}
    else{shake($('ga'));$('ga').value='';if(qs.length>1)setTimeout(showGate,500)}
  };
  $('gg').onclick=go;$('ga').onkeydown=function(e){if(e.key==='Enter')go()};
}
function setCfg(p){
  CFG=Object.assign({},CFG,p);applyCfg();
  if(db)db.doc('cfg/main').set({addName:CFG.addName,gate:CFG.gate,qs:CFG.qs||[]}).catch(function(){say('Cần quyền chủ trang để lưu cài đặt',3500)});
}

// ----- dev mode -----
async function sha(t){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}catch(e){return''}}
function pwModal(){
  modal('<div class="hd">Dev mode</div><input id="pw" type="password" placeholder="Mật khẩu" autocomplete="off"><button id="pg">Vào</button>');
  var go=async function(){if(await sha($('pw').value)===PWH){unmodal();setDev(true);$('dev').style.display='block';renderDev()}else{shake($('pw'));$('pw').value=''}};
  $('pg').onclick=go;$('pw').onkeydown=function(e){if(e.key==='Enter')go()};setTimeout(function(){$('pw').focus()},300);
}
function setDev(on){
  DEV=on;safe(function(){on?sessionStorage.setItem('a2dev','1'):sessionStorage.removeItem('a2dev')});
  $('devb').style.display=on?'':'none';if(!on)$('dev').style.display='none';
  applyCfg();renderChat();
}
$('devb').onclick=function(){var p=$('dev');p.style.display=p.style.display==='block'?'none':'block';renderDev()};
function renderDev(){
  var p=$('dev');if(!DEV||p.style.display!=='block')return;
  var vq=$('nq')?$('nq').value:'',va=$('na')?$('na').value:'',qs=CFG.qs||[];
  var h='<div class="dh"><div class="hd">Chủ trang ✦</div><button class="sm" data-a="exit">Đóng</button></div>';
  h+='<label class="tg"><input type="checkbox" data-a="tAdd" '+(CFG.addName?'checked':'')+'> Hiện nút thêm tên</label>';
  h+='<label class="tg"><input type="checkbox" data-a="tGate" '+(CFG.gate?'checked':'')+'> Duyệt người vào bằng câu hỏi</label>';
  h+='<div class="sec">Bộ câu hỏi ('+qs.length+')</div>';
  qs.forEach(function(x,i){h+='<div class="row"><span>'+esc(x.q)+' → '+esc(x.a.join(' | '))+'</span><button class="sm" data-a="dq" data-i="'+i+'">✕</button></div>'});
  h+='<input id="nq" placeholder="Câu hỏi"><input id="na" placeholder="Đáp án (nhiều đáp án cách nhau dấu phẩy)"><button class="sm" data-a="aq">+ Thêm câu hỏi</button>';
  h+='<div class="sec">Hàng chờ duyệt ('+QUEUE.length+')</div><div class="qg">';
  QUEUE.forEach(function(q,i){h+='<div class="qi"><img src="'+esc(q.turl||q.url)+'" alt=""><div><button data-a="ok" data-i="'+i+'">✓</button><button data-a="no" data-i="'+i+'">✕</button></div></div>'});
  h+='</div><div class="sec">Chat</div><button class="sm" data-a="clr">Xóa toàn bộ chat</button>';
  p.innerHTML=h;$('nq').value=vq;$('na').value=va;
}
$('dev').addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,i=+t.dataset.i;
  if(a==='exit'){$('dev').style.display='none';return}
  if(a==='tAdd')return setCfg({addName:t.checked});
  if(a==='tGate')return setCfg({gate:t.checked});
  if(a==='aq'){
    var q=$('nq').value.trim(),an=$('na').value.split(',').map(function(x){return x.trim()}).filter(Boolean);
    if(!q||!an.length)return say('Nhập câu hỏi và đáp án',2500);
    $('nq').value='';$('na').value='';return setCfg({qs:(CFG.qs||[]).concat([{q:q,a:an}])});
  }
  if(a==='dq')return setCfg({qs:CFG.qs.filter(function(_,k){return k!==i})});
  if(a==='ok')return approve(QUEUE[i]);
  if(a==='no')return rejectQ(QUEUE[i]);
  if(a==='clr')return clearChat();
});
function approve(q){
  if(!q||!db)return;
  db.collection('photos').add({url:q.url,turl:q.turl||'',aid:q.aid||'',tid:q.tid||'',h:q.h||'',ar:q.ar||0,ts:Date.now(),uid:''})
    .then(function(){return db.doc('queue/'+q.id).delete()}).catch(function(){say('Chưa duyệt được',3000)});
}
function rejectQ(q){if(!q||!db)return;db.doc('queue/'+q.id).delete();delAsset(q.aid);delAsset(q.tid)}
function delPhoto(p){
  if(db&&p.id.charAt(0)!=='l')db.doc('photos/'+p.id).delete().catch(function(){say('Không xóa được',3000)});
  else setPhotos(plist.filter(function(x){return x.id!==p.id}));
  delAsset(p.aid);delAsset(p.tid);
}
function devAct(it){
  if(it.photo){
    var p=PH[it.pid];if(!p)return;
    modal('<img class="pv" src="'+esc(p.turl||p.url)+'" alt=""><div class="r2"><button id="dv">Xem lớn</button><button id="dd">Xóa ảnh</button><button id="dr">Đổi ảnh</button></div>');$('dv').onclick=function(){unmodal();openZoom(it)};
    $('dd').onclick=function(){unmodal();delPhoto(p)};
    $('dr').onclick=function(){replId=p.id;unmodal();$('file2').click()};
  }else{
    modal('<div class="hd">Sửa tên</div><input id="en" maxlength="24" value="'+esc(it.t)+'"><div class="r2"><button id="dd">Xóa</button><button id="ds">Lưu</button></div>');
    $('dd').onclick=function(){unmodal();if(db)db.doc('names/'+it.nid).delete()};
    $('ds').onclick=function(){var t=$('en').value.trim().slice(0,24);unmodal();if(t&&db)db.doc('names/'+it.nid).update({t:t})};
  }
}

var chatOpen=false,msgs=[],lastCid='',cinit=false;
$('cn').value=safe(function(){return localStorage.getItem('a2n')})||'';
function updSend(){$('cs').disabled=!$('cn').value.trim()||!db}

$('chatb').onclick=function(){chatOpen=!chatOpen;$('chat').classList.toggle('on',chatOpen);$('bdg').style.display='none';if(chatOpen)renderChat()};
function renderChat(){
  var l=$('cl');l.innerHTML='';
  if(!db){l.innerHTML='<div class="m">Đăng nhập Claude để nhắn tin cùng cả lớp ✦</div>';return}
  var f=document.createDocumentFragment();
  msgs.forEach(function(m){

function sendChat(){

$('cs').onclick=sendChat;$('ci').onkeydown=function(e){if(e.key==='Enter')sendChat()};
function chatStart(){
  db.collection('chat').orderBy('ts','desc').limit(80).onSnapshot(function(s){
    var l=s.docs.map(function(d){var r=d.data()||{};return{id:d.id,n:String(r.n||'?'),t:String(r.t||''),uid:r.uid||''}}).reverse(),lm=l[l.length-1];
    if(cinit&&!chatOpen&&lm&&lm.id!==lastCid&&lm.uid!==uid)$('bdg').style.display='block';

function clearChat(){
  ask('Xóa toàn bộ tin nhắn?',async function(){
    try{var s=await db.collection('chat').limit(500).get();await Promise.all(s.docs.map(function(d){return db.doc('chat/'+d.id).delete()}))}
    catch(e){say('Chưa xóa được',3000)}

}

// ----- tải ảnh: xử lý, kiểm duyệt, chống trùng -----
function shrink(f){return new Promise(function(res){
  if(!/^image\/(jpeg|png)$/.test(f.type)||f.size<300*1024)return res(f);
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    var M=1400,w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,M/Math.max(w,h));
    if(sc===1){URL.revokeObjectURL(u);return res(f)}
    var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    var png=f.type==='image/png',t=png?'image/png':'image/jpeg';
    c.toBlob(function(b){URL.revokeObjectURL(u);res(b?new File([b],f.name.replace(/\.\w+$/,'')+(png?'.png':'.jpg'),{type:t}):f)},t,.85);
  };
  im.onerror=function(){URL.revokeObjectURL(u);res(f)};im.src=u;
})}
function loadImg(b){return new Promise(function(ok,no){var u=URL.createObjectURL(b),im=new Image();im.onload=function(){ok({im:im,u:u})};im.onerror=function(){URL.revokeObjectURL(u);no()};im.src=u})}
function dhash(im){
  var c=document.createElement('canvas');c.width=9;c.height=8;var x=c.getContext('2d');x.drawImage(im,0,0,9,8);
  var d=x.getImageData(0,0,9,8).data,b='';
  for(var y=0;y<8;y++)for(var i=0;i<8;i++){var p=(y*9+i)*4,q=p+4;b+=(d[p]*.3+d[p+1]*.59+d[p+2]*.11)>(d[q]*.3+d[q+1]*.59+d[q+2]*.11)?'1':'0'}
  return b;
}
async function prep(f){
  var gif=f.type==='image/gif',main=gif?f:await shrink(f),L=await loadImg(main),im=L.im,w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,560/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  var hs=dhash(im);URL.revokeObjectURL(L.u);
  var tb=await new Promise(function(r){c.toBlob(r,'image/jpeg',.78)});
  return{main:main,tb:tb,h:hs,ar:+(w/h).toFixed(3),gif:gif};
}
function hamm(a,b){var n=0;for(var i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n}
function isDup(P){
  if(!P.h||/^(0+|1+)$/.test(P.h))return false;
  return plist.concat(seenH).some(function(p){return p.h&&p.h.length===64&&Math.abs((p.ar||P.ar)-P.ar)<.08&&hamm(p.h,P.h)<=5});
}
var PROMPT=`Bạn xem ảnh cho trang lưu niệm của một lớp học sinh THPT. Chỉ trả lời bằng JSON: {"v":"ok"|"review"|"reject"}.
Quy tắc NỚI LỎNG: "ok" cho gần như mọi ảnh bình thường (ảnh lớp, selfie, đồ ăn, phong cảnh, meme, ảnh vui, ảnh có chữ, học sinh mặc đồng phục hay ôm vai bạn bè).
"reject" CHỈ khi RÕ RÀNG: khiêu dâm hoặc khỏa thân, bạo lực máu me ghê rợn, ma túy hoặc vũ khí đe dọa, biểu tượng thù hận, bắt nạt hay xúc phạm cá nhân, lộ giấy tờ hoặc thẻ ngân hàng.
"review" khi bạn thực sự phân vân.`;
async function judge(tb){
  if(!sample)return'review';
  try{
    var lim=await sample.limits();if(!lim.images)return'review';
    var r=await sample.json(PROMPT,{images:[tb],modelTier:'quick',cache:false}),v=String(r&&r.v||'').toLowerCase();
    return v==='ok'||v==='reject'?v:'review';
  }catch(e){return'review'}
}
async function uploadPair(P){
  var a=await assets.upload(P.main),t=null;
  if(!P.gif){try{t=await assets.upload(new File([P.tb],'t.jpg',{type:'image/jpeg'}))}catch(e){}}
  return{url:a.url,aid:a.id,turl:t?t.url:'',tid:t?t.id:''};
}
async function addFiles(fs){
  var r={ok:0,dup:0,rej:0,wait:0,bad:0};ld(true);
  try{
    for(var i=0;i<fs.length;i++){
      var f=fs[i];
      if(!/^image\//.test(f.type)||f.size>8*1024*1024){r.bad++;continue}
      if(!(db&&assets)){setPhotos([{id:'l'+Date.now()+i,url:URL.createObjectURL(f),turl:'',h:'',ts:Date.now()}].concat(plist));r.ok++;continue}
      try{
        var P=await prep(f);
        if(isDup(P)){r.dup++;continue}
        var v=await judge(P.tb);
        if(v==='reject'){r.rej++;continue}
        var up=await uploadPair(P),rec={url:up.url,turl:up.turl,aid:up.aid,tid:up.tid,h:P.h,ar:P.ar,ts:Date.now(),uid:uid};
        seenH.push({h:P.h,ar:P.ar});
        if(DEV){await db.collection('photos').add(rec);r.ok++}else{await db.collection('queue').add(rec);r.wait++}
      }catch(e){r.bad++}
    }
  }finally{ld(false)}
  var m=[];
  if(r.ok)m.push('Đã thêm vào vũ trụ ✨');if(r.wait)m.push('Ký ức của bạn sẽ hiện sau khi chủ trang duyệt ✨');
  if(r.dup)m.push('Ảnh này đã có trong vũ trụ rồi');if(r.rej)m.push('Ảnh này chưa phù hợp để thêm vào');if(r.bad)m.push('Có ảnh chưa thêm được');
  say(m.join(' · '),4500);
}
$('up').onclick=function(){$('file').click()};
$('upm').onclick=function(){$('filem').click()};
$('filem').onchange=function(){var fs=Array.prototype.slice.call(this.files);this.value='';addFiles(fs)};
frame.addEventListener('dragover',function(e){e.preventDefault()});
frame.addEventListener('drop',function(e){e.preventDefault();var fs=Array.prototype.slice.call(e.dataTransfer.files).filter(function(f){return /^image\//.test(f.type)});if(fs.length)addFiles(fs)});
$('file').onchange=function(){var fs=Array.prototype.slice.call(this.files);this.value='';addFiles(fs)};
$('file2').onchange=async function(){
  var f=this.files[0];this.value='';if(!f||!replId||!db||!assets)return;var id=replId;replId='';ld(true);
  try{var P=await prep(f),up=await uploadPair(P),o=PH[id]||{};await db.doc('photos/'+id).update({url:up.url,turl:up.turl,aid:up.aid,tid:up.tid,h:P.h,ar:P.ar});delAsset(o.aid);delAsset(o.tid)}
  catch(e){say('Chưa đổi được ảnh',3000)}
  ld(false);
};

// ----- kết nối dữ liệu -----
function startDb(){
  var t=setTimeout(function(){say('Đang tải ký ức…')},10000);
  db.collection('photos').orderBy('ts','desc').limit(500).onSnapshot(function(s){
    clearTimeout(t);var l=[];
    s.docs.forEach(function(d){var r=d.data();if(r&&r.url)l.push({id:d.id,url:r.url,turl:r.turl||'',h:r.h||'',ar:r.ar||0,aid:r.aid||r.id||'',tid:r.tid||'',ts:r.ts||0})});
    setPhotos(l);
  },function(){say('Không tải được ảnh chung',4000)});
  db.collection('names').orderBy('ts','desc').limit(30).onSnapshot(function(s){
    setNames(s.docs.map(function(d){return{id:d.id,t:String((d.data()||{}).t||'')}}).filter(function(n){return n.t}));
  });
  db.doc('cfg/main').onSnapshot(function(s){CFG=Object.assign({addName:true,gate:false,qs:[]},s.exists?s.data():{});applyCfg()});
  db.collection('queue').orderBy('ts','desc').limit(100).onSnapshot(function(s){
    QUEUE=s.docs.map(function(d){var r=d.data()||{};return{id:d.id,url:r.url,turl:r.turl,aid:r.aid,tid:r.tid,h:r.h,ar:r.ar}});renderDev();
  },function(){QUEUE=[]});
  chatStart();updSend();
}
(async function(){
  try{
    var c=window.claude;
    if(c&&c.use){
      db=await c.use('db');
      if(db)startDb();else say('Chưa đăng nhập — ảnh chỉ lưu tạm trên máy bạn',6000);
      updSend();renderChat();
      assets=await c.use('assets');user=await c.use('user');
      if(user){try{uid=(await user.id())||''}catch(e){}if(safe(function(){return user.isOwner()}))setDev(true)}
      applyCfg();
      sample=await c.use('sample');
    }
  }catch(e){}
})();
